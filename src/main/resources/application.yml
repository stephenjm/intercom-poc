spring:
  datasource:
    url: jdbc:h2:file:./data/intercom_poc_db
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  chat:
    history:
      page-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: intercom-poc